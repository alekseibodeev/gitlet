[project]
name = "gitlet"
version = "0.1.0"
description = "A version-control system"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pytest>=9.0.3",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest]
markers = ["skip_autouse: skip auto use fixtures for this test."]
